name: AMR news agent
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node ragna-2-0-task-force/agent/fetch-news.mjs ragna-2-0-task-force/news.json
      - run: |
          git config user.name "ragna-news-agent"
          git config user.email "actions@users.noreply.github.com"
          git add ragna-2-0-task-force/news.json
          git diff --cached --quiet || git commit -m "AMR news update"
          git push
