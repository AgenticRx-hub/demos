*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;margin:0}
header{background:var(--navy);color:#fff;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:16px max(16px,env(safe-area-inset-left,0px)) 0;border-bottom:3px solid var(--gold)}
header .in,main{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header h1{margin:0;font:600 22px var(--serif);text-wrap:balance}header p{margin:4px 0 12px;color:#d6c290;font-size:12px;letter-spacing:.08em}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:6px;padding:3px}
.lang button{font:600 13px var(--sans);background:transparent;color:#c9d3df;border:0;padding:5px 10px;border-radius:4px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#0F2A47}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{font:600 13.5px var(--sans);background:transparent;color:#c9d3df;border:0;padding:9px 14px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--bg);color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:8px 12px;margin:14px 0;font-size:13.5px}
h2{font:600 18px var(--serif);margin:0 0 8px;text-wrap:balance}h3{font:600 14.5px var(--sans);margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}.kpi b{display:block;font:600 22px var(--mono);font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--idle);border-radius:4px;overflow:hidden;margin:4px 0 10px;position:relative}.bar>div{height:100%;background:var(--accent)}.bar>i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}.row b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.course{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.course .thumb{height:54px;border-radius:4px;display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font:600 12px var(--sans);letter-spacing:.06em}
.course h4{margin:0;font:600 14.5px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--fg);white-space:nowrap}
.chip.c{background:var(--warnbg);color:var(--warn)}.chip.ok{background:var(--okbg);color:var(--ok)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);width:100%}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}
td.wrapc{white-space:normal;min-width:220px}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--fg)}th.sort[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--gold)}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
button.btn{font:600 13.5px var(--sans);background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:5px;padding:7px 12px;cursor:pointer}
button.ghost{font:500 13px var(--sans);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;margin:0 6px 6px 0}
button.ghost:hover{border-color:var(--gold)}
.tab{display:none}.tab.on{display:block}
/* pathway */
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.step{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg);position:relative;font-size:13.5px}
.step b{display:block;font-size:14px}.step.done{border-color:var(--ok)}.step.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.step .st{font-size:12px;color:var(--muted)}
.pl{display:flex;flex-direction:column;gap:6px}
.pl button{text-align:left;font:600 14px var(--sans);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer}
.pl button[aria-pressed="true"]{border-color:var(--gold);background:var(--tint)}
.pl button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px;margin-top:8px}
.cmp{border-left:3px solid var(--gold);padding:4px 8px;font-size:13px;background:var(--bg);border-radius:0 4px 4px 0}
/* heat */
.heat td{text-align:center;font-family:var(--mono);font-size:12.5px}
.heat td:first-child{text-align:left;font-family:var(--sans)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto;padding:4px}
.msg{max-width:92%;padding:10px 12px;border-radius:8px;font-size:14px}
.msg.u{align-self:flex-end;background:var(--navy);color:#fff}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px}
.rec b{font-size:14px}.rec ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.ask{display:flex;gap:8px;margin-top:10px}
svg text{fill:var(--muted);font:12px var(--sans)}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}
@media (max-width:520px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function answer(q){const s=" "+q.toLowerCase()+" ";chat.push({u:q});
let langWant=/fran[cç]|french|francés/.test(s)?"fr":/espa[nñ]ol|spanish|espagnol/.test(s)?"es":/arab/.test(s)?"ar":null;
const short=/short|court|corto|quick|rapide|r[aá]pid|20|minute/.test(s);

const score=c=>{let v=0;const [a,b]=ME[c.sk];v+=(b-a)*3;if(c.lv==Math.min(a,2))v+=3;if(langWant&&c.lg.includes(langWant))v+=4;if(langWant&&!c.lg.includes(langWant))v-=10;if(short)v+=c.min<=45?4:-3;v+=c.rt;const p=PATHS.find(p=>p.c.includes(c.id));if(p&&p.st[p.c.indexOf(c.id)]==2)v-=20;return v};
pool.sort((x,y)=>score(y)-score(x));const pick=pool.slice(0,3);

const li=rs.map(k=>R[k]).filter(Boolean).slice(0,4);
return `<div class="rec"><b>${esc(c.t[L])}</b> <span class="small muted">· ${fmtMin(c.min)} · ${lname(c)}</span><div class="small muted">${t("why")}:</div><ul>${li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
